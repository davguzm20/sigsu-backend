apiVersion: 1
datasources:
  - name: Prometheus
    uid: sigsu-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
  - name: Tempo
    uid: sigsu-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
