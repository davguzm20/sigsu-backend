global:
  scrape_interval: 5s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 7d

scrape_configs:
  - job_name: sigsu-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /run/secrets/metrics_username
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: [backend:8080]
